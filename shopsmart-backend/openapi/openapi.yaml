components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProductIdParam:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrderIdParam:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageCursorParam:
      name: page[cursor]
      in: query
      schema:
        type: string
    PageLimitParam:
      name: page[limit]
      in: query
      schema:
        type: integer
        default: 20
        maximum: 100
    GuestCartIdHeader:
      name: X-Guest-Cart-Id
      in: header
      required: false
      schema:
        type: string
      description: Required for guest cart/checkout operations when not authenticated
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
  schemas:
    SuccessEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data: {}
        meta:
          type: object
          properties:
            requestId:
              type: string
              format: uuid
            timestamp:
              type: string
              format: date-time
    PaginatedEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items: {}
        pagination:
          type: object
          properties:
            nextCursor:
              type: string
              nullable: true
            hasMore:
              type: boolean
            limit:
              type: integer
        meta:
          type: object
          properties:
            requestId:
              type: string
              format: uuid
            timestamp:
              type: string
              format: date-time
    ProblemDetails:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            type:
              type: string
              format: uri
            title:
              type: string
            status:
              type: integer
            code:
              type: string
            detail:
              type: string
            userMessage:
              type: string
            instance:
              type: string
            requestId:
              type: string
              format: uuid
            timestamp:
              type: string
              format: date-time
            validationErrors:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
    CreateProductRequest:
      type: object
      required:
        - title
        - slug
        - description
        - basePrice
        - categoryId
      properties:
        title:
          type: string
        slug:
          type: string
        description:
          type: string
        basePrice:
          type: number
        categoryId:
          type: string
          format: uuid
        brandId:
          type: string
          format: uuid
  responses:
    ValidationError:
      description: Request failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    AuthError:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ForbiddenError:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ConflictError:
      description: State conflict (stock, business rule, etc.)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
