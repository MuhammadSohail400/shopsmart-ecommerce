# Reverse proxy for the ShopSmart AI API (SDD Section 19 / Backend Standards Section 21).
# A second layer of rate limiting sits here, in front of the app's own
# Redis-backed limiter — defense in depth (Backend Standards Section 16).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1024;

    # Edge-layer rate limiting (coarse; the app's own limiter is the
    # authoritative, per-route-tuned layer — see API Design Spec Section 16)
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=2r/s;

    upstream shopsmart_api {
        server app:4000;
    }

    server {
        listen 80;
        server_name _;

        # Security headers (defense in depth alongside Helmet in the app itself)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        client_max_body_size 5m; # matches the product-image upload limit (Backend Standards Section 13)

        location /api/v1/auth/ {
            limit_req zone=api_auth burst=5 nodelay;
            proxy_pass http://shopsmart_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/webhooks/stripe {
            # No rate limiting on the webhook path — Stripe's own retry
            # policy governs traffic here, and we don't want to drop
            # legitimate webhook deliveries under a coarse edge limit.
            proxy_pass http://shopsmart_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            limit_req zone=api_general burst=40 nodelay;
            proxy_pass http://shopsmart_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://shopsmart_api;
            access_log off;
        }
    }
}
