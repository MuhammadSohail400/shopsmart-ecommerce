name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # Runs on every PR and every push — lint, type-check, test
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shopsmart
          POSTGRES_PASSWORD: shopsmart
          POSTGRES_DB: shopsmart
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shopsmart"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://shopsmart:shopsmart@localhost:5432/shopsmart
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-test-secret-not-for-production
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run migrations
        run: npx prisma migrate deploy

      - name: Run tests
        run: npx vitest run --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  # Runs only on merge to main — build and push the Docker image
  build-and-push:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # TODO: replace with real registry credentials (GitHub Secrets:
      # REGISTRY_USERNAME, REGISTRY_PASSWORD) before enabling this in production
      - name: Log in to container registry
        if: false # flip to `true` once registry secrets are configured
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false # flip to `true` once the login step above is enabled
          tags: shopsmart-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # TODO: add a real deploy step here — e.g. push to ECS/Cloud Run/Fly.io
      # and trigger a rolling deployment. Left as a stub since target
      # infrastructure isn't decided yet.
      - name: Deploy (placeholder)
        run: echo "TODO: wire up deployment to production infrastructure"
